[package]
name = "cat-recycle-bin"
version = "1.0.0"
description = "A tiny Windows desktop recycle bin"
authors = ["Cat Recycle Bin contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "cat_recycle_bin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
